<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="800"
     viewBox="0 0 1600 800"
     role="img"
     aria-label="Big Rusty Drums top-down audition kit">

  <defs>
    <!-- Drum shell gradient -->
    <linearGradient id="drumShellRust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3a2a"/>
      <stop offset="0.4" stop-color="#8b4f32"/>
      <stop offset="1" stop-color="#3a2419"/>
    </linearGradient>

    <!-- Drum head -->
    <radialGradient id="drumHead" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#f5f2ea"/>
      <stop offset="0.7" stop-color="#d7d0c4"/>
      <stop offset="1" stop-color="#b3aa9a"/>
    </radialGradient>

    <!-- Cymbal metal -->
    <radialGradient id="cymbalMetal" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#f0d9a0"/>
      <stop offset="0.6" stop-color="#c79a52"/>
      <stop offset="1" stop-color="#8a642f"/>
    </radialGradient>

    <!-- China darker metal -->
    <radialGradient id="chinaMetal" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#d8c08a"/>
      <stop offset="0.6" stop-color="#a07032"/>
      <stop offset="1" stop-color="#5b3a1c"/>
    </radialGradient>

    <!-- Stack metal -->
    <radialGradient id="stackMetal" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#f2e6c8"/>
      <stop offset="0.6" stop-color="#c9b07a"/>
      <stop offset="1" stop-color="#8b7444"/>
    </radialGradient>

    <!-- Simple rim color -->
    <linearGradient id="rimMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#555"/>
    </linearGradient>
  </defs>

  <!-- KICK 22 (center front) -->
  <g id="kick22">
    <!-- shell ellipse -->
    <ellipse cx="800" cy="560" rx="210" ry="120"
             fill="url(#drumShellRust)" stroke="#1b120d" stroke-width="6"/>
    <!-- head -->
    <ellipse cx="800" cy="560" rx="180" ry="100"
             fill="url(#drumHead)" stroke="#7a6f60" stroke-width="4"/>
    <!-- small port hole -->
    <circle cx="900" cy="580" r="26" fill="#1b1815" stroke="#000" stroke-width="3"/>
  </g>

  <!-- SNARE 14 (front of drummer, slightly left) -->
  <g id="snare14">
    <!-- shell -->
    <ellipse cx="720" cy="460" rx="90" ry="55"
             fill="url(#drumShellRust)" stroke="#1b120d" stroke-width="4"/>
    <!-- head -->
    <ellipse cx="720" cy="455" rx="80" ry="48"
             fill="url(#drumHead)" stroke="#7a6f60" stroke-width="3"/>
    <!-- lugs hint -->
    <ellipse cx="720" cy="465" rx="88" ry="56"
             fill="none" stroke="#2b2b2b" stroke-width="3" stroke-dasharray="10 14"/>
  </g>

  <!-- HI-HAT 14 (far left) -->
  <g id="hihat14">
    <!-- bottom hat -->
    <ellipse cx="420" cy="470" rx="70" ry="40"
             fill="url(#cymbalMetal)" stroke="#5a3b1f" stroke-width="3"/>
    <!-- top hat slightly smaller -->
    <ellipse cx="420" cy="465" rx="62" ry="34"
             fill="url(#cymbalMetal)" stroke="#5a3b1f" stroke-width="2"/>
    <!-- center hole -->
    <circle cx="420" cy="465" r="6" fill="#2b1b10"/>
  </g>

  <!-- TOM 14 (rack, above kick left) -->
  <g id="tom14">
    <ellipse cx="740" cy="360" rx="80" ry="50"
             fill="url(#drumShellRust)" stroke="#1b120d" stroke-width="4"/>
    <ellipse cx="740" cy="355" rx="70" ry="42"
             fill="url(#drumHead)" stroke="#7a6f60" stroke-width="3"/>
  </g>

  <!-- TOM 15 (rack, above kick right) -->
  <g id="tom15">
    <ellipse cx="860" cy="360" rx="85" ry="52"
             fill="url(#drumShellRust)" stroke="#1b120d" stroke-width="4"/>
    <ellipse cx="860" cy="355" rx="75" ry="44"
             fill="url(#drumHead)" stroke="#7a6f60" stroke-width="3"/>
  </g>

  <!-- TOM 18 (floor, drummer right) -->
  <g id="tom18">
    <ellipse cx="1020" cy="540" rx="110" ry="70"
             fill="url(#drumShellRust)" stroke="#1b120d" stroke-width="4"/>
    <ellipse cx="1020" cy="535" rx="98" ry="60"
             fill="url(#drumHead)" stroke="#7a6f60" stroke-width="3"/>
  </g>

  <!-- TOM 22 (floor, far right) -->
  <g id="tom22">
    <ellipse cx="1180" cy="540" rx="125" ry="75"
             fill="url(#drumShellRust)" stroke="#1b120d" stroke-width="4"/>
    <ellipse cx="1180" cy="535" rx="112" ry="64"
             fill="url(#drumHead)" stroke="#7a6f60" stroke-width="3"/>
  </g>

  <!-- CRASH 17 (center-left, raised) -->
  <g id="crash17">
    <ellipse cx="620" cy="260" rx="95" ry="55"
             fill="url(#cymbalMetal)" stroke="#5a3b1f" stroke-width="3"/>
    <circle cx="620" cy="260" r="6" fill="#2b1b10"/>
  </g>

  <!-- CRASH SIZZLE 17 (near crash, separated) -->
  <g id="crash_sizzle17">
    <ellipse cx="760" cy="230" rx="95" ry="55"
             fill="url(#cymbalMetal)" stroke="#5a3b1f" stroke-width="3"/>
    <circle cx="760" cy="230" r="6" fill="#2b1b10"/>
    <!-- simple sizzle chain hint -->
    <circle cx="790" cy="215" r="4" fill="#d0c0a0"/>
    <circle cx="805" cy="225" r="4" fill="#d0c0a0"/>
    <circle cx="795" cy="240" r="4" fill="#d0c0a0"/>
  </g>

  <!-- RIDE 22 (right, raised) -->
  <g id="ride22">
    <ellipse cx="1040" cy="260" rx="115" ry="60"
             fill="url(#cymbalMetal)" stroke="#5a3b1f" stroke-width="3"/>
    <circle cx="1040" cy="260" r="6" fill="#2b1b10"/>
  </g>

  <!-- RIDE SIZZLE 19 (near ride, separated) -->
  <g id="ride_sizzle19">
    <ellipse cx="1200" cy="240" rx="100" ry="55"
             fill="url(#cymbalMetal)" stroke="#5a3b1f" stroke-width="3"/>
    <circle cx="1200" cy="240" r="6" fill="#2b1b10"/>
    <!-- sizzle chain hint -->
    <circle cx="1230" cy="225" r="4" fill="#d0c0a0"/>
    <circle cx="1245" cy="238" r="4" fill="#d0c0a0"/>
    <circle cx="1228" cy="252" r="4" fill="#d0c0a0"/>
  </g>

  <!-- CHINA 18 (far right back, inverted) -->
  <g id="china18">
    <!-- inverted look: darker rim, lighter center -->
    <ellipse cx="1350" cy="190" rx="95" ry="50"
             fill="url(#chinaMetal)" stroke="#3b2414" stroke-width="3"/>
    <ellipse cx="1350" cy="190" rx="70" ry="35"
             fill="#3b2414" opacity="0.7"/>
    <circle cx="1350" cy="190" r="6" fill="#1b120b"/>
  </g>

  <!-- STACK (center-back, above toms) -->
  <g id="stack">
    <!-- bottom cymbal -->
    <ellipse cx="800" cy="170" rx="70" ry="40"
             fill="url(#stackMetal)" stroke="#6a5430" stroke-width="3"/>
    <!-- top cymbal slightly smaller -->
    <ellipse cx="800" cy="165" rx="55" ry="32"
             fill="url(#stackMetal)" stroke="#6a5430" stroke-width="2"/>
    <circle cx="800" cy="165" r="5" fill="#2b1b10"/>
  </g>

  <!-- =========================
       HITBOXES (13 elements)
       ========================= -->

  <!-- Kick -->
  <ellipse id="hb_kick22"
           cx="800" cy="560" rx="210" ry="120"
           fill="transparent" stroke="none"/>

  <!-- Snare -->
  <ellipse id="hb_snare14"
           cx="720" cy="460" rx="95" ry="60"
           fill="transparent" stroke="none"/>

  <!-- Hi-hat -->
  <ellipse id="hb_hihat14"
           cx="420" cy="470" rx="75" ry="45"
           fill="transparent" stroke="none"/>

  <!-- Tom 14 -->
  <ellipse id="hb_tom14"
           cx="740" cy="360" rx="85" ry="55"
           fill="transparent" stroke="none"/>

  <!-- Tom 15 -->
  <ellipse id="hb_tom15"
           cx="860" cy="360" rx="90" ry="57"
           fill="transparent" stroke="none"/>

  <!-- Tom 18 -->
  <ellipse id="hb_tom18"
           cx="1020" cy="540" rx="115" ry="75"
           fill="transparent" stroke="none"/>

  <!-- Tom 22 -->
  <ellipse id="hb_tom22"
           cx="1180" cy="540" rx="130" ry="80"
           fill="transparent" stroke="none"/>

  <!-- Crash 17 -->
  <ellipse id="hb_crash17"
           cx="620" cy="260" rx="100" ry="60"
           fill="transparent" stroke="none"/>

  <!-- Crash Sizzle 17 -->
  <ellipse id="hb_crash_sizzle17"
           cx="760" cy="230" rx="100" ry="60"
           fill="transparent" stroke="none"/>

  <!-- Ride 22 -->
  <ellipse id="hb_ride22"
           cx="1040" cy="260" rx="120" ry="65"
           fill="transparent" stroke="none"/>

  <!-- Ride Sizzle 19 -->
  <ellipse id="hb_ride_sizzle19"
           cx="1200" cy="240" rx="105" ry="60"
           fill="transparent" stroke="none"/>

  <!-- China 18 -->
  <ellipse id="hb_china18"
           cx="1350" cy="190" rx="100" ry="55"
           fill="transparent" stroke="none"/>

  <!-- Stack -->
  <ellipse id="hb_stack"
           cx="800" cy="170" rx="75" ry="45"
           fill="transparent" stroke="none"/>

</svg>