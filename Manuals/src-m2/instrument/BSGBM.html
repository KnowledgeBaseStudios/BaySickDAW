<p>The window menu on BaySickGuitars and BaySickBasses - identical on both.
Top half is the guitar-channel tour; bottom half is tab housekeeping.</p>

<figure data-views="BSGBM">

<p id="BSGBM-1"><b>Pedals.</b> The pedalboard that feeds this instrument -
stompbox effects in a chain before the amp.</p>

<p id="BSGBM-2"><b>NAM/IR.</b> The amp-and-cabinet window after the board -
amp captures and cabinet impulse responses.</p>

<p id="BSGBM-3"><b>Piano Roll.</b> Jumps to the roll pointed at this tab, so
written notes play this instrument.</p>

<p id="BSGBM-4"><b>FX Rack.</b> This channel's six-slot effects rack -
studio effects after the amp, before the mixer.</p>

<p id="BSGBM-5"><b>Freeze.</b> Renders the tab and plays the render instead
of running the instrument live. Greyed when unavailable with the reason in
the tooltip; cyan label = frozen, orange = the render has gone stale.</p>

<p id="BSGBM-6"><b>Lock</b> (tick while locked, <code>[L]</code> on the
ribbon slot), <span id="BSGBM-7"></span><b>Rename...</b>,
<span id="BSGBM-8"></span><b>Duplicate Inst (new tab)</b> and
<span id="BSGBM-11"></span><b>Delete Inst</b> - the standard tab
housekeeping.</p>

<p id="BSGBM-9"><b>Save Page Preset As...</b> and
<span id="BSGBM-10"></span><b>Load Page Preset</b> capture and recall the
whole instrument setup as one preset.</p>
