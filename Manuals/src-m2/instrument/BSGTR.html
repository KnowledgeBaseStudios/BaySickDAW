<p>BaySickGuitars is the sampled guitar: real recordings of a real
instrument, mapped across the keyboard. The panel you see is drawn from the
loaded instrument itself, so these are the guitar's own controls.</p>

<figure data-cluster="The instrument|1,2">

<p id="BSGTR-1"><b>The loaded-instrument field</b> names what is loaded,
and <span id="BSGTR-2"></span><b>Load Guitar</b> swaps it for another from
the library. Different instruments bring different recordings and
sometimes different controls.</p>

<figure data-cluster="Note behavior|3,4">

<p id="BSGTR-3"><b>CUT SELF</b> makes each new note stop the previous one
- the way a real string can only ring one way at a time. On for tight
picked lines; off lets notes ring over each other.
<span id="BSGTR-4"></span><b>SAME PITCH</b> narrows the cut to repeated
identical notes only, and its face flips to <code>CUT ALL</code> when you
want every note to cut.</p>

<figure data-cluster="Thickness and realism|5,6">

<p id="BSGTR-5"><b>Unison / Width / Detune</b> stack copies of the sound,
spread them across the stereo field, and tune them slightly apart - the
sampled equivalent of a guitarist recording the part twice, once left,
once right. Small amounts double-track; large amounts wall-of-guitars.</p>

<p id="BSGTR-6"><b>Releases</b> sets how much of the recorded
release noise plays - the sound of fingers leaving strings. It seems like
a detail; it is a surprising amount of what makes a sampled guitar read
as real. Too low sounds airbrushed, too high sounds squeaky.</p>

<figure data-cluster="Vibrato|7">

<p id="BSGTR-7"><b>VIBRATO</b> - the finger-wobble on a held note.
<code>Guitar</code> and <code>Violin</code> set two styles of depth,
<code>Tailpiece</code> the bend-from-the-bridge character,
<code>Speed</code> how fast the wobble runs, <code>Fade</code> how long a
note holds still before the vibrato arrives (real players add it late,
not instantly), and <code>Humanize</code> keeps it from being perfectly
regular.</p>

<figure data-cluster="Performance|8,9">

<p id="BSGTR-8"><b>PERFORMANCE.</b> <code>TP bends</code> is the depth of
tailpiece bends. <code>Mute</code> brings in palm-muted recordings - the
chunky damped sound of a hand resting on the strings. <code>Feedback</code>
adds controlled amp squeal to held notes.</p>

<p id="BSGTR-9"><b>Swing Mix</b> - the small knob on the title bar next to
Menu - sets how much of the transport's global Swing this instrument
feels, from none to full. Swing pushes every second sixteenth-note late to
make parts groove; per-player mix means the drums can swing hard while the
guitar stays straight. Right-click offers <code>Truncate Swing
Notes</code> for cleaning up notes that swing pushed into each other.</p>

<p><b>Loading control surface...</b> covers the panel for
the moment the instrument's artwork takes to arrive after a load - not an
error, just the load in progress.</p>
