<p>Where drums come from. Two choices happen every time you pick a drum, and
they are independent of each other: <b>where</b> you pick it, and <b>what
kind</b> of sound it is. Get these two straight and the menu below reads
itself.</p>

<figure data-views="BSDRUMS">

<p><b>Where - route one: the Drum Kit.</b> The fastest way. Click an empty
pad on the Drum Kit and the drum is created on the spot with the sound
picker already open - pick something and it lands on that pad; back out and
the pad returns to empty, nothing created. Right-click a pad that already
has a drum and you get the menu below, where <b>Replace Sound...</b> reopens
the same picker on the existing drum.</p>

<p><b>Where - route two: the ribbon.</b> The ribbon's <code>+</code> menu
carries a <b>BaySickDrums</b> entry with the engine choice right there -
BaySickPlayer or BaySickSynth. This route creates the drum as a tab first
and you load its sound from the drum's own window. It is the long way
around for one drum, but it is the route you are already on when you are
building tabs anyway.</p>

<p><b>What kind - sample or synth.</b> Every drum is its own little player,
and it runs one of two engines. A <b>sample</b> drum (BaySickPlayer) plays
audio you point it at - a single hit, a folder of hits, an SFZ, or a
library sound - and is the usual choice for acoustic kits and anything you
found as a WAV. A <b>synth</b> drum (BaySickSynth) plays a patch instead -
808 kicks, electronic toms, zaps - no samples needed at all. The sound
picker offers both kinds side by side, and you never commit to one: loading
a sample onto a synth drum, or a patch onto a sample drum, just swaps the
engine underneath while the drum's notes, mixer strip, effects and pad
position all stay put.</p>

<p>Either way the drum ends up the same thing: a pad on the kit, a tab on
the ribbon, a strip on the mixer, and the menu below on a right-click.</p>
