<p>The Rusty Drums Map - the note-to-drum table, opened from the Rusty
window menu. Its own window, so you can leave it open beside the Piano Roll
while writing a part.</p>

<figure data-views="BSRDMAP">

<p id="BSRDMAP-1"><b>The table.</b> One row per kit-native note, four
columns: <b>Key</b> (the note name, like <code>C3</code>), <b>MIDI</b> (the
raw note number), <b>Sound</b> (which drum), and <b>Articulation</b> (how it
is hit - stick, rimshot, brush, and so on). Scroll it to see everything the
loaded kit answers to; this window is the authoritative list, straight from
the kit itself. It works even with no Rusty tab open - it reads the
installed kit.</p>
