<p>The Rusty window's Drum Kit view: the kit as a photograph, playable by
mouse. Opened from the window menu's <b>Drum Kit</b> entry.</p>

<figure data-views="BSRDKIT">

<p id="BSRDKIT-1"><b>The kit itself.</b> Every drum and cymbal in the photo
is a click target - click a snare, hear that snare, with a thin blue outline
marking the piece while it is pressed. Hover over anything and the tooltip
names it. It is the quickest way to audition the kit and learn which sound
is which before you write a part.</p>

<p id="BSRDKIT-2"><b>The hi-hat pedal.</b> Always ringed: green with
<code>PEDAL: OPEN</code>, red with <code>PEDAL: CLOSED</code>. It follows the
engine's pedal state live, so while a pattern plays you can watch the hat
open and close - and clicking the pedal works it by hand.</p>

<p id="BSRDKIT-3"><b>Pick a program to begin.</b> The overlay you see before
a kit program is loaded. Pick one from the kit dropdown on the title bar and
the photo comes alive.</p>
