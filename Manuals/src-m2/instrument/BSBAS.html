<p>BaySickBasses is the sampled bass - and a different instrument from
BaySickGuitars, not a setting on it: its own recordings and its own
control surface. The panel is drawn from the loaded instrument.</p>

<figure data-cluster="The instrument|1,2">

<p id="BSBAS-1"><b>The loaded-instrument field</b> names the current bass,
and <span id="BSBAS-2"></span><b>Load Bass</b> swaps it for another from
the library.</p>

<figure data-cluster="Playing behavior|3,4,9,10">

<p id="BSBAS-3"><b>Mono / Preroll.</b> <code>Mono</code> enforces one note
at a time - a new note silences the last, the way a bassline on one string
behaves. <code>Preroll</code> starts each recording a touch before the
beat, so the pluck's attack lands ON the beat instead of just after it -
sampled instruments feel late without this.</p>

<p id="BSBAS-4"><b>Swell / Release.</b> Swell fades notes in for bowed,
pad-like playing instead of plucked attacks. Release sets how much of the
recorded note-off sound - the finger damping the string - plays.</p>

<p id="BSBAS-9"><b>CUT SELF</b> and <span id="BSBAS-10"></span><b>SAME
PITCH</b> work exactly as on the guitar: a new note stops the previous
one, optionally only when it is the same note repeating, with the
<code>CUT ALL</code> flip for cutting everything.</p>

<figure data-cluster="Thickness|5">

<p id="BSBAS-5"><b>Unison / Width</b> stack and widen copies of the sound.
Use sparingly on bass - low end usually wants to sit solid in the center
of the stereo picture - but it is here for the parts that want size.</p>

<figure data-cluster="Vibrato|6,7">

<p id="BSBAS-6"><b>VIBRATO</b> - <code>Depth</code> (how far the pitch
wobbles), <code>Tremolo</code> (a volume wobble layered with it),
<code>Rate</code> (how fast) - <span id="BSBAS-7"></span>with
<b>Delay / Fade / Humanize</b> deciding when it arrives after the note
starts, how gradually it fades in, and how much natural irregularity keeps
it from sounding mechanical.</p>

<figure data-cluster="The filter|8">

<p id="BSBAS-8"><b>FILTER</b> - a full synth-style filter laid over the
recordings, which is what lets a sampled bass behave like a synth bass. A
filter is a tone control: <code>Cutoff</code> sets where the brightness
stops (left = darker, right = brighter) and <code>Reso</code> adds a peak
right at that point for squelch. <code>Veltrack</code> opens the filter
more when you play harder; <code>Wobble</code> adds cyclic movement; and
<code>Attack</code> / <code>Decay</code> / <code>Depth</code> give the
filter its own envelope, so each note can start bright and darken - the
classic pluck - on top of real bass recordings.</p>

<p id="BSBAS-11"><b>Swing Mix</b> - the small knob on the title bar next to
Menu - sets how much of the transport's global Swing this instrument
feels, from none to full. Swing pushes every second sixteenth-note late to
make parts groove; per-player mix means the drums can swing hard while the
guitar stays straight. Right-click offers <code>Truncate Swing
Notes</code> for cleaning up notes that swing pushed into each other.</p>

<p><b>Loading control surface...</b> covers the
panel briefly while a newly loaded instrument's artwork arrives.</p>
