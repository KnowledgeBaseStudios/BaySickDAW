<p>The pedalboard works like the floor in front of a guitarist: eight
stompboxes in a row, the signal walking through them left to right on its
way to the amp. Slot 1 is always the tuner, slot 8 is always an EQ, and the
six between are yours to fill.</p>

<figure data-cluster="Board controls|1,2">

<p id="BSPDL-1"><b>View</b> swaps between the full-size board and the
compact one - same pedals, same settings, two window sizes:
<b>Standard</b> is the full-size board with
every control on its faceplate (the tick marks the active view), and
<b>Compact</b> is the condensed board shown
below. <span id="BSPDL-2"></span><b>Preset</b> saves and recalls the
whole board: which pedals, in what order, with every knob position.</p>

<figure data-cluster="Compact view|">

<p><b>In Compact view</b>, a slot dropdown
(<code>1  Tuner</code> through <code>8  Graphic EQ</code>,
<code>(empty)</code> for unfilled) becomes the way to reach each slot -
the compact board shows one pedal at a time.
A pedal opened as its own window elsewhere in
the app uses this same compact face.</p>

<figure data-cluster="Slots|3,4,7,11,12">

<p id="BSPDL-3"><b>An empty slot</b> is a dashed outline with a
<code>+</code> - click it and the pedal picker opens.
<span id="BSPDL-4"></span><b>A filled slot</b> shows the pedal itself with
its name at the top; right-click the pedal's face to swap it for a
different one.</p>

<p id="BSPDL-7"><b>The ON footswitch</b> at each pedal's foot engages it -
green when on, silent pass-through when off. Exactly like stepping on the
real thing, and the fastest way to hear what a pedal is adding.</p>

<p id="BSPDL-11"><b>The X</b> removes a pedal from its slot, and
<span id="BSPDL-12"></span><b>the reorder arrows</b> move it along the
chain. Order genuinely matters: distortion INTO delay means your echoes
are copies of a distorted note; delay INTO distortion means the echoes
themselves get crushed - same two pedals, different sound. The arrows grey
out at the chain's ends.</p>

<figure data-cluster="Per-pedal presets|5">

<p id="BSPDL-5"><b>The <code>...</code> button</b> on each pedal is that
pedal's own preset menu: <code>Save Preset As...</code>, the
<code>Factory Presets</code> and <code>My Presets</code> folders,
<code>Restore Defaults</code>, <code>Save as Default</code> (how you make
a pedal always arrive set your way) and <code>Reveal Folder...</code>. It
manages the pedal's settings - changing WHICH pedal sits there is the
right-click on its face.</p>

<figure data-cluster="The tuner|8,9">

<p id="BSPDL-8"><b>The tuner display</b> shows pitch two ways - your
choice of scrolling strobe stripes or a 21-light LED bar. Both read the
same: drifting left means flat (too low), drifting right means sharp (too
high), centered and still means in tune. The note name, the error in
cents (hundredths of a semitone) and the exact frequency print beside
it.</p>

<p id="BSPDL-9"><b>The tuner's switches.</b> Detection mode:
<code>Ch</code> chromatic (any note), <code>Gt</code> / <code>Bs</code>
tuned to guitar or bass strings. Display style: <code>St</code> strobe or
<code>LB</code> LED bar. The flat/drop switch offsets the whole reference
<code>0</code> to <code>6</code> semitones down, so a drop-tuned guitar
reads as in-tune instead of permanently flat. And <code>432</code>
re-references A from the standard 440 Hz to 432 Hz, for material tuned
that way.</p>

<figure data-cluster="The EQ slot|6,10">

<p id="BSPDL-6"><b>The last slot is always an EQ</b> - the final tone trim
before the amp - and its dropdown picks WHICH of the three EQ pedals lives
there. <span id="BSPDL-10"></span><b>Its controls</b> change with that
choice, so the knobs in the picture are one of three possible faces.</p>
