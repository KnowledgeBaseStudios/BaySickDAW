<p>The pedal picker - what you get when you click an empty slot or right-click
a pedal to swap it. Grouped by what the pedal does to the signal.</p>

<figure data-views="BSPDLP">

<p id="BSPDLP-1"><b>User NAM Pedal.</b> Load your own captured pedal - a
.nam file of a real unit - instead of one of the modeled types.</p>

<p id="BSPDLP-2"><b>Dynamics</b> - pedals that control level:
compressors squeeze loud and quiet closer together (the bass version tuned
for low end), and the noise gate mutes the hiss between phrases.</p>

<p id="BSPDLP-3"><b>Harmonics</b> - the dirt section: from
bass-friendly drivers through blues drive, overdrive and saturation up to
distortion, fuzz and high-gain. Also the octave pedal, which adds a note an
octave away.</p>

<p id="BSPDLP-4"><b>Modulation</b> - movement and character: chorus, flanger
and phaser swirl the signal; wah is the sweeping filter; the acoustic
simulator makes an electric read as acoustic; the polyphonic synth tracks
your playing with synth voices.</p>

<p id="BSPDLP-5"><b>Time</b> - delay repeats, reverb space, and the acoustic
preamp's studio-style tone stage.</p>

<p id="BSPDLP-6"><b>Clear</b> empties the slot; it greys when the slot is
already empty.</p>
