<p>The menu on a BaySickPlayer tab's window. It is the same menu a BaySickSynth
tab shows - the menu belongs to the tab, not the engine - so the full
walk-through lives on the BaySickSynth Menu page and everything there applies
here word for word.</p>

<figure data-views="BSPM">

<p id="BSPM-1"><b>Player</b> shows the engine view; <span id="BSPM-2"></span>
<b>Piano Roll</b> jumps the roll to this tab; <span id="BSPM-3"></span>
<b>FX Rack</b> opens this channel's rack; <span id="BSPM-4"></span>
<b>Freeze</b> renders the tab and plays the render (cyan = frozen, orange =
stale, greyed with the reason in the tooltip).</p>

<p id="BSPM-5"><b>Lock Layer</b>, <span id="BSPM-7"></span><b>Rename...</b>,
<span id="BSPM-9"></span><b>Duplicate Layer (new tab)</b> and
<span id="BSPM-15"></span><b>Delete Layer</b> are the tab housekeeping -
identical to the synth tab's.</p>

<p id="BSPM-8"><b>Replace Engine</b> swaps which engine this tab runs while
the notes, mixer settings, effects and window all stay put - the full story
(what survives, what resets, automation, freeze, undo) is on the BaySickSynth
Menu page and applies here word for word. On a player tab it is the quick way
to promote a sketch: keep the notes, trade the sample for a synth.</p>

<p id="BSPM-6"><b>Polyphony</b> reads the player's voice cap -
<code>Polyphonic</code> or <code>Monophonic</code> - and clicking toggles it.
A monophonic player is handy for basses sliced from samples: each new note
cuts the last.</p>

<p id="BSPM-10"><b>Choke Group</b> matters most on player tabs: put an open and
a closed hi-hat sample in the same group and they cut each other, the way a
real hat does.</p>

<p id="BSPM-11"><b>Save Current Patch As...</b> and <span id="BSPM-12"></span>
<b>Load Preset</b> handle the player's sound; <span id="BSPM-13"></span>
<b>Save Page Preset As...</b> and <span id="BSPM-14"></span>
<b>Load Page Preset</b> handle the whole page.</p>
