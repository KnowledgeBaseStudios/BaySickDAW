<p>The strip across the top of the BaySickSynth and BaySickBass windows -
the same three controls on both. The accent color (synth blue, bass green)
says whose window you are in, and it follows the engine everywhere it
appears - the tab, the mixer strip, the panels.</p>

<figure data-views="BSSBT">

<p id="BSSBT-1"><b>Preset.</b> The patch picker. Open it and pick a sound;
the whole engine - every panel, every knob - jumps to that patch at once.
This is the fastest way to learn either engine: pick a preset that sounds
close to what you want, then open the panels and see where the knobs
landed. The bass's factory patches all start monophonic with a touch of
slide; if a patch feels wrong for chords, flip the voice mode on the
Oscillator panel. Saving your own goes through the tab menu's
<b>Save Current Patch As...</b>.</p>

<p id="BSSBT-2"><b>Swing Mix</b> - the small knob on the title bar next to
Menu - sets how much of the transport's global Swing this instrument
feels, from none to full. Swing pushes every second sixteenth-note late to
make parts groove; per-player mix means the drums can swing hard while the
guitar stays straight. Right-click offers <code>Truncate Swing
Notes</code> for cleaning up notes that swing pushed into each other.</p>
