<p>The BaySickRustyDrums window menu. Three views of the same kit, its note
map, and the page housekeeping. There is no FX Rack entry here - the Rusty
channel's effects live on its mixer strip's rack like every other channel,
reached from the mixer.</p>

<figure data-views="BSRDMENU">

<p id="BSRDMENU-1"><b>Drum Kit.</b> The kit photograph view - the real drum
set, where every drum and cymbal is a click target you can play.</p>

<p id="BSRDMENU-2"><b>Player.</b> The control-panel view - the seven section
panels (Main, Kick, Snare, Toms, Hi-hat, Cymbals, Noises) with all the mixing
and shaping knobs. The tick marks whichever view is showing.</p>

<p id="BSRDMENU-3"><b>Piano Roll.</b> Jumps the roll to this tab for writing
drum parts by hand.</p>

<p id="BSRDMENU-4"><b>Rusty Drums Map...</b> The note-to-drum table - which
key plays which sound with which articulation. The fastest answer to "what do
I press for a rimshot."</p>

<p id="BSRDMENU-5"><b>Freeze.</b> Renders the kit's output and plays the
render. Greyed when unavailable with the reason in the tooltip; cyan label =
frozen, orange = stale.</p>

<p id="BSRDMENU-6"><b>Save Page Preset As...</b> and
<span id="BSRDMENU-7"></span><b>Load Page Preset</b> save and recall the
whole kit setup - every section panel's settings - as one preset.</p>
