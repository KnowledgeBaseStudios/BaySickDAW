<p>The Vox page menu. The top half is navigation - the four editors that make
up the vocal channel - and the bottom half is the usual tab housekeeping.</p>

<figure data-views="BSVCM">

<p id="BSVCM-1"><b>Vocal Chain.</b> Opens the chain editor - the locked
run of stages (gate, de-reverb, de-esser, compressor, saturation, limiter,
amp) every vocal passes through. This is where the tone gets shaped.</p>

<p id="BSVCM-2"><b>BaySickPitch.</b> The offline pitch editor - analyze a
recorded take, then drag notes to repair or restyle the melody.</p>

<p id="BSVCM-3"><b>BaySickAlign.</b> Time-aligns one take to another - a
double to a lead, a harmony to the main - so stacked vocals land together.</p>

<p id="BSVCM-4"><b>NAM/IR.</b> The amp-and-cabinet window shared with the
guitar side; on a vocal it is a color box - run the voice through an amp
capture or an impulse response for character.</p>

<p id="BSVCM-5"><b>FX Rack.</b> This channel's six-slot effects rack, after
the chain and before the mixer.</p>

<p id="BSVCM-6"><b>Freeze.</b> Renders the tab and plays the render. On a
vocal this is a bigger commitment than elsewhere: the capture point sits
below the ENTIRE chain - gate to limiter, plus pitch and alignment - so a
confirm warns you first. Once frozen, reaching for the de-esser does nothing
until you unfreeze. Greyed when unavailable (tooltip says why); cyan label =
frozen, orange = stale.</p>

<p id="BSVCM-7"><b>Lock</b> protects the tab (tick while locked,
<code>[L]</code> on the ribbon slot); <span id="BSVCM-8"></span>
<b>Rename...</b> names it; <span id="BSVCM-9"></span><b>Duplicate Vox (new
tab)</b> clones the whole channel into a fresh tab;
<span id="BSVCM-12"></span><b>Delete Vox</b> removes it.</p>

<p id="BSVCM-10"><b>Save Page Preset As...</b> and
<span id="BSVCM-11"></span><b>Load Page Preset</b> save and recall the whole
vocal setup - chain settings and all - as one preset.</p>
