<p>The Mod panel is the character drawer - five independent machines that
each add one kind of personality to the sound. Most patches use one or two
of them, not all five; each is off or neutral until you reach for it.</p>

<figure data-cluster="Noise|1">

<p id="BSSBMOD-1"><b>The noise group.</b> Noise is sound with every
frequency at once - static. The color picker chooses its flavor:
<code>White</code> is even and hissy; the darker colors weight it toward
the lows, more rumble than hiss. The <code>NOISE ONLY</code> switch mutes
the oscillator entirely so noise IS the voice - flip it on, shape the
result with the envelopes and filter, and you have built a snare, a hat,
or wind from scratch.</p>

<figure data-cluster="Transients and bursts|2,3,4">

<p id="BSSBMOD-2"><b>TRANSIENT.</b> A transient is the tiny burst of
attack at the front of a sound - the click of a pick, the snap of a stick.
This machine staples one onto every note: <code>AMT</code> is how loud the
click is, <code>DUR</code> how long it lasts, <code>COLOUR</code> how
bright. A little of it makes a soft, slow patch still speak clearly - the
attack you can hear even when the envelope fades in slowly.</p>

<p id="BSSBMOD-3"><b>BURST ENV.</b> With <code>BURST</code> on, one
key-press fires a rapid machine-gun of retriggers instead of a single
note. <span id="BSSBMOD-4"></span><b>COUNT</b> sets how many hits,
<b>SPACING</b> how far apart they land. Instant stutters, rolls and edm
fills without writing the individual notes.</p>

<figure data-cluster="Drift and unison|5,6">

<p id="BSSBMOD-5"><b>DRIFT</b> lets the tuning wander, slowly and
randomly, the way old analog hardware never quite sits still. A touch is
warmth - the "expensive vintage" quality. Too much is seasick.</p>

<p id="BSSBMOD-6"><b>UNISON</b> is the "make it huge" section. It plays
several copies of every note at once: <code>VOICES</code> how many copies,
<code>DETUNE</code> how far apart their tunings sit,
<code>SPREAD</code> how wide they fan across the stereo field. The copies
disagreeing slightly is what thickness IS. One thing it deliberately does
not change: the volume - the engine trims the copies' gain as the count
climbs, so what grows is width and density, never loudness. That is why
stacking voices does not wreck your mix balance.</p>
