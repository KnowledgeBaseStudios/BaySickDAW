<p>The BaySickRustyDrums window's top strip: the title bar and, below it, the
section tabs that page through the kit's panels.</p>

<figure data-views="BSRDTTL">

<p id="BSRDTTL-1"><b>Presets.</b> Saved kit setups - every section panel's
settings in one recallable state.</p>

<p id="BSRDTTL-2"><b>The kit dropdown</b> (<code>Full</code>) picks which
kit program is loaded. Everything else on the window - the panels, the kit
photo, the note map - reads from whatever this loads.</p>

<p id="BSRDTTL-3"><b>The section tabs.</b> <code>Main</code> /
<code>Kick</code> / <code>Snare</code> / <code>Toms</code> /
<code>Hi-hat</code> / <code>Cymbals</code> / <code>Noises</code>. Main is
the whole kit's mixer in one view; each other tab opens that instrument's
own panel with its deeper controls. Same sound engine throughout - the tabs
just change how much detail you are looking at.</p>
