<p>BaySickSynth and BaySickBass are two versions of the same instrument. The
synth lives on <b>Layers</b> tabs and the bass on <b>Bass</b> tabs, but open
them side by side and you are looking at the same window: the same waveform
strip, the same six panel tabs, the same knobs in the same places.</p>

<figure data-views="BSSB">

<p>What separates them is the tuning of the defaults, not the controls. The
bass starts monophonic - one note at a time, the way most basslines want to be
played - with a small built-in slide between notes and a darker filter
setting, so it sounds like a bass the moment you add the tab. The synth starts
polyphonic and wide open. Everything either one does, the other can be set to
do; the presets and defaults just start them in different places.</p>

<p>Because the two are twins, the panel pages that follow are written once and
serve both. Where a default lands somewhere different on the bass, the panel's
text says so.</p>
