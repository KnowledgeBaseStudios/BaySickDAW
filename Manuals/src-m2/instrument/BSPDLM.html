<p>The Pedals window menu - navigation between the two guitar-tone windows,
then the tab housekeeping.</p>

<figure data-views="BSPDLM">

<p id="BSPDLM-1"><b>Pedals.</b> This window - the board itself. The tick
marks it while it is showing.</p>

<p id="BSPDLM-2"><b>NAM/IR.</b> The amp-and-cabinet window that sits after
the board: amp captures and cabinet impulse responses. Pedals shape the
signal, NAM/IR gives it the amp.</p>

<p id="BSPDLM-3"><b>Lock</b> protects the tab from edits (tick while locked,
<code>[L]</code> on its ribbon slot).</p>

<p id="BSPDLM-4"><b>Rename...</b> names the tab;
<span id="BSPDLM-5"></span><b>Duplicate Inst (new tab)</b> clones it - board,
pedal settings and all - into a fresh tab;
<span id="BSPDLM-8"></span><b>Delete Inst</b> removes it.</p>

<p id="BSPDLM-6"><b>Save Page Preset As...</b> and
<span id="BSPDLM-7"></span><b>Load Page Preset</b> save and recall the whole
board - which pedals, in what order, with what settings - as one preset.
Individual pedals save their own presets from the <code>...</code> button on
the pedal itself.</p>
