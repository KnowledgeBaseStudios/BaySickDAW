<p>The Master Analyzer's menu.</p>

<figure data-views="ANLZM">

<p id="ANLZM-1"><b>View</b> - <code>Loudness</code> or
<code>Spectrum</code>, tick on the current face.</p>

<p id="ANLZM-2"><b>Source</b> - <code>Live</code>, then every captured
take; <code>No captured takes yet</code> greyed when there are none.</p>

<p id="ANLZM-3"><b>Target</b> - the loudness standards:
<code>Streaming (-14 LUFS)</code> for the major platforms,
<code>Streaming (-16 LUFS)</code> for the quieter ones,
<code>EBU R128 (-23 LUFS)</code> and <code>ATSC A/85 (-24 LKFS)</code> for
broadcast. Pick one and the target line moves.</p>

<p id="ANLZM-4"><b>Custom...</b> - your own number. While a custom target
is active the row reads <code>Custom (-X.X LUFS)...</code> and carries the
tick.</p>

<p id="ANLZM-5"><b>Reset history</b> - clears the graph and restarts the
integrated measurement. Do it before a final full-song pass: integrated
loudness counts everything it has heard, including your noodling.</p>
