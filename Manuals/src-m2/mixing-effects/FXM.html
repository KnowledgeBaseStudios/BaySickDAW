<p>The effect window's menu.</p>

<figure data-views="FXM">

<p id="FXM-1"><b>Show Advanced Controls.</b> Advanced is a mode, not a
tab - the panel re-lays itself with the full control set, and the entry
flips to <code>Show Basic Controls</code> for the way back. Basic is the
short set of the most-used controls; nothing is lost either way.</p>

<p id="FXM-2"><b>Mode:</b> the effect's character menu, on effects that
have more than one algorithm - same knobs, different engine underneath.</p>

<p id="FXM-3"><b>SC:</b> picks the sidechain source from the strip's
receive lines - what this effect listens to instead of (or alongside) its
own input. The other half of the mixer's <code>Sidechain...</code>
routing.</p>

<p id="FXM-4"><b>Presets...</b> - the effect's own preset library.</p>

<p id="FXM-5"><b>Visual</b> opens the effect's Visual window - present only
on the nine effects that have one, absent (not greyed) elsewhere.</p>

<p><b>Automate</b> - hosted third-party effects only:
<code>Last Touched</code> plus the plugin's full parameter list in chunked
ranges (<code>(no parameters reported)</code> if the plugin offers none).</p>

<p><b>Run bridged (separate process)</b> - hosted effects only:
moves the plugin into the sandbox helper, ticked when on; the disabled form
names whatever locks it. <b>Retry Loading
Plugin</b> appears only while a hosted plugin is down.</p>
