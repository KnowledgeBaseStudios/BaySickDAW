<p>The Master Analyzer measures how loud your song really is - not how loud
it feels in your room, but the number streaming services measure it by. That
number is called LUFS (loudness units relative to full scale): a scale built
to match human hearing, where a typical streaming target is around
-14.</p>

<figure data-cluster="Source and takes|1,2,3,4">

<p id="ANLZ-1"><b>The source picker</b> chooses what is measured:
<code>Live</code> - whatever is playing right now - or a captured
<em>take</em>, a stored measurement pass you can inspect afterwards. Every
playback pass becomes a take on its own. Takes with no audio in them show a
<code>(no audio)</code> suffix; takes opened from a report show
<code>(report)</code>. <span id="ANLZ-2"></span><b>vs ...</b> lays a second
take over the Loudness view so two passes can be compared on one graph.
<span id="ANLZ-3"></span><b>Export Take...</b> writes the selected take as
its own report file (with its audio alongside when the take was captured
with audio), and <span id="ANLZ-4"></span><b>Remove Take</b> drops the take
from the list and from the session report it was saved in.</p>

<figure data-cluster="The view bar|5">

<p id="ANLZ-5"><b>Levels / Loudness / Spectrum</b> are the window's three
faces - how loud it is right now is a number, whether it stayed there is a
line over time, what it is made of is a spectrum - and <b>Reset</b> clears
everything that accumulates: integrated loudness, the history, both true-peak
maxima, the over-ceiling count and the spectrum's peak hold.</p>

<figure data-cluster="Levels|6">

<p id="ANLZ-6"><b>Levels</b> is the number view. The big <b>INTEGRATED</b>
reading is the whole program measured start to finish - THE number streaming
platforms judge - colored against your target: green within 1 LU, amber
within 3, red beyond, with the offset in LU under it. <b>M</b> (momentary,
the last 0.4 seconds) and <b>S</b> (short-term, the last 3 seconds) are
bars centered on the target, so "on target" is the middle of the bar.
<b>TRUE PEAK</b> shows each channel separately with the ceiling marked and
the running maximum beside it, counts the moments that went over the
ceiling, and reads out PLR and PSR (peak minus integrated, peak minus
short-term - how much headroom the dynamics are using). <b>CORR</b> fills
to the right for left/right that agree and to the left, in red, for content
that cancels when someone plays the mix in mono.</p>

<figure data-cluster="Loudness|7">

<p id="ANLZ-7"><b>Loudness</b> graphs loudness over time: short-term loudness
as a filled area with the momentary line over it, a dashed green target
line, the loudness-range band shaded amber (the span between the song's
quiet and loud parts), and a time axis. The history is the whole
session or the whole take: the mouse wheel zooms, dragging pans,
double-click shows everything, and hovering reads the time and the S / M
values under the pointer. The side cells carry <b>INTEGRATED</b>,
<b>SHORT-TERM</b>, <b>MOMENTARY</b>, <b>LRA</b> and <b>MAX TP L / R</b>.
While a take is selected an orange <b><code>TAKE:</code></b> caption sits
in the corner so a stored measurement can never be mistaken for the live
one.</p>

<figure data-cluster="Spectrum|8,9,10">

<p id="ANLZ-8"><b>Spectrum</b> is energy across the frequency range on a
log grid: a filled cyan averaged trace under a grey peak-hold trace, <b>MAX
TP L / R</b> in the corner and two dBFS level bars at the side. Loudness
tells you how much; spectrum tells you WHERE - too much low end and a dull
top show up here. <span id="ANLZ-9"></span><b>Tilt</b> slopes the
display by 0, 3 or 4.5 dB per octave (at 3, pink noise reads flat, which is
how most finished mixes are judged), and <span id="ANLZ-10"></span><b>1/3
oct</b> shows third-octave bars instead of the line.</p>

<p>The readouts show <code>--.-</code> until there is signal: dashes, not
zeros, because silence measures as nothing. The target and the true-peak
ceiling the views grade against come from the loudness spec picked in the
Menu (the same one the Export Audio dialog uses).</p>
