<p>Two strips side by side: an engine strip (<code>Bass 1</code>) and a
live-input strip (<code>Vox 1</code>). Everything the engine strip carries
is taught on the Mixer page. What is numbered here is the row of controls
only LIVE inputs have - the strips that record a microphone or an
instrument plugged into your interface.</p>

<figure data-views="MIXSTP">

<p id="MIXSTP-1"><b>The A arm LED.</b> "Armed" means ready to record -
red means this strip will capture when recording starts. Its tooltip
names the input channel it is listening to, and <b>right-clicking it
picks that input</b>: your audio device's channels listed mono and stereo
(<code>No channels available</code> when the device offers none), plus -
on Vox strips - the <code>Builder Grid Default</code> routes
(<code>Dry</code> / <code>Dry Cleaned</code> / <code>Wet</code> /
<code>Wet Cleaned</code>, deciding which version of a take the Builder
receives) and <code>Disarm</code> while armed.</p>

<p id="MIXSTP-2"><b>The headphones LED</b> is monitoring - hearing
yourself through the mix while you perform. Click to listen;
<b>right-click picks WHAT you hear</b>: on a Vox strip
<code>True Dry</code> (just your voice), <code>Bypass Pitch
Corrector</code> (effects but no tuning - most singers' choice, because
performing against your own corrected voice is disorienting), or
<code>With Effect</code> (everything); on an Inst strip <code>Dry</code>
/ <code>With Effect</code>.</p>

<p id="MIXSTP-3"><b>The split meter</b> - peak bars below, the scrolling
level-history band above - on every strip but Master.</p>

<p>On the sampled-instrument strips (BaySickGuitars /
BaySickBasses) both LEDs disappear: those tabs are not live inputs, so
their strips read like engine strips.</p>
