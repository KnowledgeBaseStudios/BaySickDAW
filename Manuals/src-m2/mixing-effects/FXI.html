<p>The Effects Rack is every channel's effects chain: six slots in a row
that the channel's sound passes through in order, with an EQ on either side
of them. One window serves every channel - the picker at the top re-aims
it.</p>

<figure data-cluster="Channel, bypass, and the two EQs|1,2,3,4">

<p id="FXI-1"><b>The Channel picker</b> chooses whose rack you are
looking at. It is one window that re-points, not a window per channel.</p>

<p id="FXI-2"><b>FX Bypass</b> switches all six slots out at once for the
selected channel, keeping every setting - the same control the mixer
strip carries.</p>

<p id="FXI-3"><b>Pre EQ</b> and <span id="FXI-4"></span><b>Post EQ</b>
open the channel's two equalizers - one BEFORE the rack (shape what the
effects receive: cut the rumble before it hits the compressor) and one
AFTER (shape what they produced). Same EQ window, two different points in
the chain.</p>

<figure data-cluster="A slot|5,6,7,8,9,10">

<p id="FXI-5"><b>A rack slot.</b> Loaded, it carries six touch points -
bypass light, name, two reorder arrows, picker chevron, remove cross.
Empty, just a label and the chevron.
<span id="FXI-6"></span><b>The label</b> reads <code>Empty</code> until
an effect lands, then the effect's name - and clicking an empty slot
opens the effect picker directly.</p>

<p id="FXI-7"><b>The reorder arrows</b> move an effect along the chain.
Order matters here just like on the pedalboard - compress then saturate
and saturate then compress are different sounds - and an effect's open
window follows it when it moves, because windows belong to the effect,
not to the slot position. <span id="FXI-8"></span><b>The chevron</b>
opens the picker to swap what is loaded.</p>

<p id="FXI-9"><b>The bypass light</b> - green working, red bypassed,
click to toggle - is the per-effect A/B, and
<span id="FXI-10"></span><b>the red cross</b> clears the slot
entirely.</p>
