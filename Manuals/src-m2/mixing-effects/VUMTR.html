<p>The VU meter - the app's one classic needle meter, on the master. The
peak meters everywhere else answer "will it clip?"; a VU deliberately
cannot. Its needle is slow and weighted, so it reads AVERAGE level - which
is much closer to how loud something feels than any peak reading.</p>

<figure data-views="VUMTR">

<p id="VUMTR-1"><b>The face.</b> Real VU ballistics: the needle takes a
moment to rise and fall, gliding over transients instead of chasing them.
That sluggishness is the feature. Mix so the needle rides around 0 on the
loud sections and the peaks breathe past it - the oldest level-setting
advice in recording, and it still works.</p>

<p id="VUMTR-2"><b>CURRENT and MAX</b> print the number under the needle
and the highest it has reached since you looked.</p>

<p id="VUMTR-3"><b>VU Calibration</b> on this window's menu decides what
0 VU means in digital terms (dBFS) - the app-wide reference, settable
from -18 to -14. It is the same single value the Effects Rack menu sets;
two doors, one setting.</p>

<p><b>Resizing</b> works diagonally only, with the ratio
locked - a drawn instrument face stretched on one axis would misread its
own scale - up to its maximum size.</p>
