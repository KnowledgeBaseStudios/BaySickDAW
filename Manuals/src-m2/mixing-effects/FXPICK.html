<p>The effect picker - what opens when you click an empty rack slot or a
slot's chevron. Grouped by what the effect does.</p>

<figure data-views="FXPICK">

<p id="FXPICK-1"><b>Dynamic</b> - level control: <code>Compressor</code>,
<code>De-esser</code>, <code>Gate</code>, <code>Limiter</code>,
<code>Transient Shaper</code>.</p>

<p id="FXPICK-2"><b>Harmonics</b> - <code>Overdrive</code> and
<code>Saturation</code>, the studio dirt.</p>

<p id="FXPICK-3"><b>Modulation</b> - <code>Chorus</code>,
<code>Flanger</code>, <code>Phaser</code>.</p>

<p id="FXPICK-4"><b>Time</b> - <code>De-reverb</code>, <code>Delay</code>,
<code>Reverb</code>.</p>

<p id="FXPICK-5"><b>Pedals</b> - the pedal-native effects, loadable into a
rack slot. This submenu is a curated subset with its own section headers,
not the pedalboard's full list - the full list lives on the board's own
picker.</p>

<p id="FXPICK-6"><b>VST Plugins</b> - your third-party effects, added under
<code>Options &gt; Plugins</code>. Before any
are added it shows the header with a greyed
<code>None added - see Options &gt; Plugins</code>.</p>
