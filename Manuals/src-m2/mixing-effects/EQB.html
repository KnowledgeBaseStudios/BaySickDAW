<p>Right-click any band handle (or its chip) and this menu opens - the
band's deeper settings.</p>

<figure data-views="EQB">

<p id="EQB-1"><b>Type</b> - the same shapes as the rail's glyph grid, from
the menu: Bell, Low Pass, High Pass, Low Shelf, High Shelf, Notch, Band
Pass, Tilt.</p>

<p id="EQB-2"><b>Slope</b> - filter shapes only - sets how steeply a cut
falls away past its point: 6 dB per octave sounds natural and invisible;
96 removes a region almost surgically; <code>Brickwall</code> is the
absolute version and belongs to the linear-phase modes (elsewhere it
plays as 96).</p>

<p id="EQB-3"><b>Channel</b> appears only in the Stereo view:
<code>Stereo</code> (both sides, the default), <code>Left</code> or
<code>Right</code> for a one-sided band (the dot wears an L or R badge).
Mid and Side are not here - they are the VIEWS, and a band's view is
already its answer.</p>

<p id="EQB-4"><b>Move to</b> sends the band to another view - Stereo, Mid
or Side - keeping every one of its settings. This is how a band changes
what half of the picture it works on.</p>

<p id="EQB-5"><b>Dynamic</b> - <code>Make Dynamic</code> turns the band
into one that moves with the music, cutting (or boosting) only when its
region crosses the threshold - an EQ that works only when needed, which
is the polite way to tame a harsh frequency. <code>Auto Release</code>
lets its recovery time follow the material: quick on transients,
unobtrusive on sustained sound.</p>

<p id="EQB-6"><b>Listen</b> latches the band's own audition (the
headphone button does the same); <b>Isolate</b> mutes every band but this
one; <b>Mute</b> silences this band's work while keeping its settings.</p>

<p id="EQB-7"><b>Reset Band</b> returns the band to its defaults - the
first eight also return to their home frequencies. <b>Delete Band</b>
removes it entirely (also the Delete key); re-enabling later starts
fresh, never a ghost of the old settings.</p>
