<p>Right-click any band handle on the EQ curve and this menu opens - the
band's deeper settings.</p>

<figure data-views="EQB">

<p id="EQB-1"><b>Filter Type</b> - the same shapes as the type box on the
panel, from the menu. <span id="EQB-2"></span><b>Slope / Order</b> sets
how steeply a cut falls away past its point: gentle slopes sound natural
and invisible; cliff-edge slopes remove a region almost surgically, at
the price of sounding more processed.</p>

<p id="EQB-3"><b>Channel</b> routes the band: <code>Stereo</code> (both
sides, the default), <code>Mid</code> (only the center of the stereo
picture), <code>Side</code> (only the edges), <code>L Only</code> /
<code>R Only</code>. This is how one band can brighten just the width, or
clean rumble out of just the middle. In the linear-phase modes the
submenu greys and says so - per-channel routing belongs to the standard
modes.</p>

<p id="EQB-4"><b>Automate</b> - opens an automation lane for any of the
band's nine parameters (<code>Freq</code>, <code>Gain</code>,
<code>Q</code>, <code>Type</code>, <code>On</code>, <code>Slope</code>,
<code>Mute</code>, <code>Solo</code>, <code>Channel</code>), so the EQ
itself can move over the song. The submenu greys when this EQ instance
has nowhere to write automation.</p>

<p id="EQB-5"><b>Make Dynamic</b> turns the band into a dynamic band: its
gain moves with the music, cutting only when the problem appears - an EQ
that works only when needed, which is the polite way to tame a harsh
frequency. It greys for shapes with no gain to move (the cuts and
notches) and in the linear modes, where the label says so.
<span id="EQB-6"></span><b>Dynamic Params...</b> opens the dynamic
band's own settings - how fast it reacts, how hard - once the band is
dynamic.</p>

<p id="EQB-7"><b>Reset Band</b> returns the band to its defaults.</p>
