<p>The Effects Rack window's menu.</p>

<figure data-views="FXRM">

<p id="FXRM-1"><b>Save FX Rack Preset...</b> captures the whole rack - all
six slots plus both EQs - for the selected channel, and
<span id="FXRM-2"></span><b>Load FX Rack Preset</b> recalls one (greyed
until something is saved). A full mixing chain as one preset.</p>

<p id="FXRM-3"><b>Open Presets Folder</b> shows the files themselves, for
backing up or sharing.</p>

<p id="FXRM-4"><b>VU Calibration</b> sets what 0 VU means in dBFS - the
app-wide reference, -18 through -14, tick on the current value. The VU
window's own menu carries the same setting; they are one value.</p>

<p id="FXRM-5"><b>VU Meter</b> opens the master VU window.</p>
