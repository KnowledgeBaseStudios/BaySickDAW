<p>The Mixer's Add menu - new strips.</p>

<figure data-views="MIXADD">

<p id="MIXADD-1"><b>Aux Strip.</b> A free strip with no channel of its own -
the destination for sends. The typical pattern: one reverb on an aux, with
every vocal sending to it.</p>

<p id="MIXADD-2"><b>The group buses</b> - <code>Vox Bus</code> through
<code>Plugins Bus</code>, one per tab family. Adding one gives that whole
family a shared strip: every Vox tab's channel flows through the Vox Bus,
so one fader rides all the vocals and one rack processes them together.</p>
