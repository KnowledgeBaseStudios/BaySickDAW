<p>An effect panel - the window a rack slot opens. Every effect in the app
shares this frame; the knobs in the middle change per effect, the controls
around them do not.</p>

<figure data-cluster="Title and bypass|1,2">

<p id="FX-1"><b>The title</b> names both the channel and the effect -
<code>&lt;channel&gt; - &lt;effect&gt;</code>, like
<code>Master - De-esser</code> - so a screen full of effect windows stays
readable.</p>

<p id="FX-2"><b>The bypass light</b> in the title strip: green means the
effect is working, RED means it is switched out, and clicking toggles it.
It is the same switch as the rack slot's light - one state, two places to
flip it. Toggle while music plays to hear what the effect is
contributing.</p>

<figure data-cluster="The controls|3,4,5">

<p id="FX-3"><b>The knobs.</b> Every parameter is one, with
<span id="FX-4"></span><b>its name</b> printed underneath. And every knob
in the app answers to right-click: exact value entry, automation, MIDI
Learn - the parameter menu covered in the Shell chapter.
<span id="FX-5"></span><b>Switch toggles</b> appear where a setting is a
two-state choice rather than a range - flick, not turn.</p>

<figure data-cluster="Level out|6,7">

<p id="FX-6"><b>Vol</b> trims the slot's output level on most panels.
Effects often make things louder, and louder
always sounds "better" - match the level here so bypassing compares the
SOUND, not the volume. (The pedal-native panels and the CS Style
Compressor carry their own <code>Level</code> knob instead.)</p>

<p id="FX-7"><b>The meter</b> on the right shows what actually leaves the
slot, in dBFS - decibels below the digital ceiling, where 0 at the top
means clipping. It is a peak meter; the app's single
VU - the slow loudness needle - is its own window.</p>
