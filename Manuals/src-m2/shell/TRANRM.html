<p>The recording menu - the record button's chevron. The dot records; this
configures.</p>

<figure data-views="TRANRM">

<p id="TRANRM-1"><b>ASIO</b> records audio through the audio device - the
tick marks the active mode.</p>

<p id="TRANRM-2"><b>MIDI (piano roll tabs only)</b> captures NOTES instead
of sound, into whichever piano-roll page is open - play your controller,
get editable notes. It is not a general MIDI router; it exists for
capturing performances into the roll.</p>

<p id="TRANRM-3"><b>Global Record-Quantize</b> - snap captured notes to a
grid at the moment recording commits: <code>Off</code> keeps your exact
timing, <code>Bar</code> / <code>Beat</code> / the step divisions tighten
it. The same 11-step list the Builder and Piano Roll snap menus use, so a
division means the same thing everywhere.</p>
