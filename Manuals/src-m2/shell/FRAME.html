<p>The main window - the fixed fullscreen frame everything else lives inside.
The transport, the ribbon and every window it contains have their own pages;
this one covers the frame itself.</p>

<figure data-views="FRAME">

<p id="FRAME-1"><b>The title</b> reads
<code>BaySickDAW - &lt;project&gt;</code> - with
<span id="FRAME-2"></span><b>a trailing <code>*</code></b> whenever there
are unsaved changes.</p>

<p id="FRAME-3"><b>The menu bar</b>: <b>File</b> (projects and export),
<span id="FRAME-4"></span><b>Edit</b> (undo and new tabs),
<span id="FRAME-5"></span><b>Patterns</b> (pattern housekeeping),
<span id="FRAME-6"></span><b>View</b> (the F-key navigation),
<span id="FRAME-7"></span><b>Options</b> (settings), and
<span id="FRAME-8"></span><b>Help</b> (these manuals). Each has its own
page.</p>

<p id="FRAME-9"><b>The transport bar</b> and
<span id="FRAME-10"></span><b>the ribbon tab bar</b> run across the top -
playback and navigation, each with its own page -
<span id="FRAME-11"></span>with <b>the performance readout</b> at the
ribbon's right end.</p>
