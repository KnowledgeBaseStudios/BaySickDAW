<p>The Options menu - the app's settings, gathered.</p>

<figure data-views="OMENU">

<p id="OMENU-1"><b>General</b> manages the default template -
<code>Set Default Template...</code> (naming the current one) and
<code>Clear Default Template</code>.</p>

<p id="OMENU-2"><b>File Settings...</b>, <span id="OMENU-3"></span>
<b>Audio Settings...</b> and <span id="OMENU-4"></span><b>Plugins...</b>
open the three settings dialogs - recording behavior, hardware, and
third-party plugins - each with its own page.</p>

<p id="OMENU-5"><b>Get Sound Content...</b> downloads the Core Library -
the factory sounds, kits and instruments.</p>

<p id="OMENU-6"><b>Undo History Size</b> - how many steps the undo stack
keeps: 100 to 1000, tick on the current choice.</p>

<p id="OMENU-7"><b>MIDI is Omni (all devices) - Read Only.</b> Permanently
greyed on purpose: it is information, not a setting. Every connected MIDI
device is always listened to - there is nothing to configure.</p>
