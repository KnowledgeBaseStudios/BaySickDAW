<p>The Builder's Edit menu - everything routes to the arrangement grid, and
every entry mirrors a key.</p>

<figure data-views="BLDE">

<p id="BLDE-1"><b>Undo</b> and <span id="BLDE-2"></span><b>Redo</b> step
the grid's history - greyed until there is something to step.</p>

<p id="BLDE-3"><b>Select All</b> (Ctrl+A) and <span id="BLDE-4"></span>
<b>Deselect</b> (Esc) manage the selection;
<span id="BLDE-5"></span><b>Copy</b> (Ctrl+C),
<span id="BLDE-6"></span><b>Paste</b> (Ctrl+V),
<span id="BLDE-7"></span><b>Delete</b> (Del) and
<span id="BLDE-8"></span><b>Duplicate</b> (Ctrl+B) act on it - Duplicate
copies and places in a single stroke.</p>
