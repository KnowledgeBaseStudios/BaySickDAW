<p>The View menu - one row per F-key navigation command. Learn the keys and
this menu becomes a reference card you never open.</p>

<figure data-views="VMENU">

<p id="VMENU-1"><b>Show Builder</b> (F5) and <span id="VMENU-2"></span>
<b>Show Mixer</b> (F6) go to the two fixed pages.</p>

<p id="VMENU-3"><b>Show Player (Most Recent)</b> (F7) returns to whichever
player window you touched last - the "Most Recent" entries all work that
way, remembering your last visit rather than a fixed target.</p>

<p id="VMENU-4"><b>Show Effects Rack</b> (F8),
<span id="VMENU-5"></span><b>Show Effect Panel</b> (F9),
<span id="VMENU-6"></span><b>Show Piano Roll</b> (F10),
<span id="VMENU-7"></span><b>Show Drum Kit</b> (F11) and
<span id="VMENU-8"></span><b>Show Event Editor</b> (F12) - each the most
recent of its kind.</p>
