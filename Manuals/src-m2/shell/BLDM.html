<p>The Builder window's Menu dropdown - clips and patterns.</p>

<figure data-views="BLDM">

<p id="BLDM-1"><b>Import Audio...</b> brings an audio file in as a clip,
ready to place on the grid.</p>

<p id="BLDM-2"><b>Rename Pattern</b> (F2) and <span id="BLDM-3"></span>
<b>Find Next Empty</b> (F3) - the same pattern housekeeping as the app's
Patterns menu, here where the patterns live.</p>

<p id="BLDM-4"><b>New Automation Clip...</b> starts an automation clip for
the picker's Auto list.</p>

<p id="BLDM-5"><b>Render Pattern to WAV...</b> renders the current pattern
alone to a file, through the render options dialog - a one-pattern
export.</p>
