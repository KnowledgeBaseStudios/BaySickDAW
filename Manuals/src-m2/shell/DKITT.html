<p>The Drum Kit's Tools menu. No Arpeggiate, Generate Chords or Transpose
here - those are pitch tools, and a slot-per-row drum layout has no pitch
to work.</p>

<figure data-views="DKITT">

<p id="DKITT-1"><b>Quantize</b> (Alt+Q) snaps hits to the grid -
tightening a played-in beat is its whole job here.
<span id="DKITT-2"></span><b>Strum</b> (Alt+S) staggers simultaneous hits
by a hair - flams and humanized layers.</p>

<p id="DKITT-3"><b>Chop...</b> cuts long hits into evens;
<span id="DKITT-4"></span><b>Glue</b> (Ctrl+G) rejoins them;
<span id="DKITT-5"></span><b>Articulate</b> (Alt+L) shapes lengths;
<span id="DKITT-6"></span><b>Randomize</b> (Alt+R) rolls variation.</p>

<p id="DKITT-7"><b>Quantize Settings</b> - the grid Quantize uses,
<code>1/4</code> to <code>1/32</code>, tick on the current.</p>
