<p>The Piano Roll is where notes are written: pitch runs up the left side as
a piano keyboard, time runs left to right, and every note is a block you
draw, drag and stretch. One roll serves every instrument in the project -
the picker at the top says whose notes you are editing.</p>

<figure data-cluster="Who you are writing for|1,2,3,13">

<p id="PR-1"><b>The tab picker</b> (<code>Bass 1</code>) aims the roll at
a tab. The roll follows THIS picker, not whatever the ribbon shows -
which is how you can edit a bassline while a drum window is open.
<span id="PR-13"></span><b>The target readout</b>
(<code>Bass 1 - BaySickBass</code>) confirms the tab and the engine your
notes will play. <span id="PR-2"></span><b>Player Page</b> jumps to that
tab's instrument window and <span id="PR-3"></span><b>FX Rack</b> to its
effects, so writing and sound-shaping stay one click apart.</p>

<figure data-cluster="Menus and snap|4,5,6,7,8,9">

<p id="PR-4">The five menus - <b>Edit</b>, <span id="PR-5"></span>
<b>Tools</b>, <span id="PR-6"></span><b>Scale</b>,
<span id="PR-7"></span><b>Chords</b>, <span id="PR-8"></span><b>View</b> -
each have their own pages. <span id="PR-9"></span><b>Snap</b> makes
drawn and dragged notes land on the grid lines - on for tight rhythm, off
for free timing.</p>

<figure data-cluster="Tools|10,11,12,21">

<p id="PR-10"><b>The tool buttons</b> - Draw, Paint, Del, Mute, Slice,
Select, Zoom - choose the mouse's job, one active at a time, each on a
single key too. Draw makes one note per click; Paint sweeps many;
Slice cuts. <span id="PR-21"></span><b>The note-type button</b> beside
them arms what Draw draws: <code>Flat</code> ordinary notes, or the
slide and glide types (<code>RP Slide</code> / <code>RT Slide</code> /
<code>Porta</code> / <code>Bend</code>) that bend into or out of pitch.
Click it or press <code>S</code> to cycle; press <code>S</code> with
notes selected and those notes CONVERT to the armed type instead.</p>

<p id="PR-11"><b>Undo / Redo</b> ride the app-wide history, and
<span id="PR-12"></span><b>H</b> opens that history as a clickable
list.</p>

<figure data-cluster="The canvas|14,15,18">

<p id="PR-14"><b>The ruler</b> counts bars,
<span id="PR-15"></span><b>the playhead</b> is the green marker riding
playback, and <span id="PR-18"></span><b>the grid</b> is the paper: one
row per semitone, with every C row banded lighter so you always know
which octave you are in.</p>

<figure data-cluster="The keyboard|16,17">

<p id="PR-16"><b>The keyboard is playable</b>: click any key and the
aimed tab's instrument sounds that note - hosted plugins included -
so you can find your note before you draw it. Silence just means the tab
has no instrument loaded. <span id="PR-17"></span><b>The C labels</b>
(<code>C6</code>, <code>C7</code>...) anchor the octaves.
On instruments that use them, <b>amber
full-width keys</b> labelled like <code>C6 Sustain</code> are
keyswitches - keys that change HOW the instrument plays (its
articulation) instead of sounding a note - and where the instrument
supplies its own note names, they replace the octave labels.</p>

<figure data-cluster="The controller lane|19,20">

<p id="PR-19"><b>The lane picker</b> (<code>Control &gt; Velocity</code>)
chooses what the strip below the grid edits - a clean click picks the
mode, and dragging the header vertically resizes the lane.
<span id="PR-20"></span><b>The lane</b> shows one bar per note, with
25/50/75% guide lines. Velocity - how hard each note is played - is the
default mode and the important one: sculpt these bars and a flat
programmed part starts breathing.</p>

<p>Every Piano Roll shortcut - the tool keys, <code>S</code> for note
types, and the rest - is listed on the Key Binds window's
<code>Piano Roll</code> tab, in the Help menu.</p>
