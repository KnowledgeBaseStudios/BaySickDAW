<p>The Edit menu.</p>

<figure data-views="EMENU">

<p id="EMENU-1"><b>Undo</b> (Ctrl+Z) and <span id="EMENU-2"></span>
<b>Redo</b> (Ctrl+Alt+Z) step the app-wide history - they grey when there
is nothing left to step. <span id="EMENU-3"></span><b>History...</b> opens
the whole stack as a clickable list.</p>

<p id="EMENU-4"><b>New Tab</b> embeds the same engine list the ribbon's
<code>+</code> opens - every way to add a tab, reachable from the menu
bar too.</p>

<p id="EMENU-5"><b>New Automation Clip</b> starts a fresh automation clip -
what the Event Editor edits.</p>
