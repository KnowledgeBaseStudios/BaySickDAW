<p>The Drum Kit is the Piano Roll rebuilt for beats: instead of one row per
pitch, one row per DRUM, each with its own sound. Everything not covered
here - tools, snap, menus, the lane - works exactly as it does on the
Piano Roll.</p>

<figure data-cluster="A kit row|3,4,5,6,10">

<p id="DKIT-3"><b>A row.</b> Sixteen per kit, and each carries, left to
right: <span id="DKIT-4"></span><b>the sound picker</b> (reads <code>Pick a
sound</code> until you choose - a row is silent until it has a sound),
<span id="DKIT-5"></span><b>M</b>ute and
<span id="DKIT-6"></span><b>S</b>olo, and at the right end
<span id="DKIT-10"></span><b>an audition key</b> - the white piano key
that plays the row's sound so you can check it without writing a note
(it greys while held). A locked row shows
<b><code>[L]</code></b> before its name.</p>

<figure data-cluster="Two kits, lock, and save|1,2,7,8,9">

<p id="DKIT-7"><b>1-16 / 17-32.</b> Two INDEPENDENT kits, not two halves
of one: each has its own drum bus in the mixer, its own kit file, its own
lock, and a drum never moves between them.
<span id="DKIT-8"></span><b>Kit</b> saves
and loads the sixteen drums of whichever kit you are on;
<span id="DKIT-2"></span><b>Lock/Unlock 1-16</b> locks the visible kit's
rows against accidental edits.</p>

<p id="DKIT-1"><b>The tab picker</b> works as on the roll;
<span id="DKIT-9"></span><b>Sel</b> is the roll's Select tool.</p>

<p>The kit's mouse moves - dragging a row's grip to reorder, the wheel
stepping one row at a time, right-click + wheel scrolling through time -
are listed with every other shortcut on the Key Binds window's
<code>Drum Kit</code> tab, in the Help menu.</p>
