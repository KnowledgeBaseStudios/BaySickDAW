<p>The Piano Roll's Chords menu.</p>

<figure data-views="PRC">

<p id="PRC-1"><b>The chord list</b> - <code>Major</code> through
<code>Add 9</code>, one tick at a time. With a chord ticked, the Draw tool
places that whole chord instead of single notes: click once, get three or
four notes voiced under your click. From simple triads at the top to
sevenths and ninths further down - pick <code>Major</code> or
<code>Minor</code> and click a progression into existence, then come back
for the fancier voicings when the part wants color.</p>
