<p>The Patterns menu - housekeeping for the pattern list. The notes inside
patterns live in the editing surfaces; this menu manages the patterns
themselves.</p>

<figure data-views="PMENU">

<p id="PMENU-1"><b>Rename / Color</b> (F2) names and colors the current
pattern - color carries into the Builder, so a colored pattern list makes
a readable arrangement.</p>

<p id="PMENU-2"><b>Find Next Empty Pattern</b> (F3) jumps to the next
blank one.</p>

<p id="PMENU-3"><b>Insert One</b> (Shift+Ctrl+Ins) adds a pattern at the
current position; <span id="PMENU-4"></span><b>Clone</b> (Alt+C)
duplicates the current one, notes and all.</p>

<p id="PMENU-5"><b>Delete</b> removes the current pattern - deliberately
no shortcut, since the bare Delete key belongs to whichever editing
surface is focused. It greys while only one pattern exists; the last
pattern cannot be deleted.</p>

<p id="PMENU-6"><b>Move Up</b> / <span id="PMENU-7"></span><b>Move
Down</b> (Shift+Ctrl+Up/Down) reorder the pattern list.</p>
