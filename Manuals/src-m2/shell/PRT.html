<p>The Piano Roll's Tools menu - the note processors. Everything here works
on the selection (or everything, with nothing selected).</p>

<figure data-views="PRT">

<p id="PRT-1"><b>Quantize</b> (Alt+Q) snaps notes to the Quantize Settings
grid. <span id="PRT-2"></span><b>Strum</b> (Alt+S)
staggers a chord's notes like a strummed guitar, and
<span id="PRT-3"></span><b>Arpeggiate</b> (Alt+A) breaks the chord into a
pattern of single notes.</p>

<p id="PRT-4"><b>Chop...</b> cuts notes into equal pieces - halves,
thirds, quarters, sixths or eighths.</p>

<p id="PRT-5"><b>Glue</b> (Ctrl+G) joins adjacent same-pitch notes back
into one; <span id="PRT-6"></span><b>Articulate</b> (Alt+L) shapes note
lengths; <span id="PRT-7"></span><b>Randomize</b> (Alt+R) generates new
material and <span id="PRT-8"></span><b>Humanize...</b> nudges timing and
velocity off the grid just enough to feel played.</p>

<p id="PRT-9"><b>Riff Machine...</b> (Alt+E) is the eight-step riff
generator - progression, chords, arpeggiation and the rest, with live
preview and one-step accept. <span id="PRT-10"></span><b>Generate
Chords</b> (Alt+P) builds chords under a melody.</p>

<p id="PRT-11"><b>Quantize Settings</b> picks the grid Quantize snaps to -
<code>1/4</code> down to <code>1/32</code>, tick on the current.</p>

<p id="PRT-12"><b>Transpose Up / Down</b> (Shift+Up/Down) move the
selection a semitone; <span id="PRT-14"></span><b>the Octave pair</b>
(Ctrl+Up/Down) move it an octave. <span id="PRT-13"></span></p>

<p id="PRT-15">Everything here lands on the undo stack as one step per
use.</p>
