<p>The metronome settings panel - the metronome chevron's floating box. The
on/off toggle is the transport button itself.</p>

<figure data-views="TRANMM">

<p id="TRANMM-1"><b>Sound</b> - <code>Sine</code>, <code>Click</code>,
<code>Wood</code> or <code>Bell</code>: the click's tone.</p>

<p id="TRANMM-2"><b>Volume</b> - the click's level, up to twice unity for
loud sessions.</p>

<p id="TRANMM-3"><b>Precount</b> - a one-bar lead-in click before
recording starts (Ctrl+P). It fires only when record is armed AND this is
on: four clicks to find the tempo, then the take begins.</p>
