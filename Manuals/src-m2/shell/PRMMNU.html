<p>The parameter menu - right-click any knob, slider or selector in the app
and this is what appears. It is the whole entry
point for automation and MIDI Learn. The picture shows the everyday shape;
three of the rows appear only in the situations they name.</p>

<figure data-views="PRMMNU">

<p id="PRMMNU-1"><b>Automate:</b> names the control it will create a lane
for - <code>Automate: Mx Master - Fader</code> - and opens the Event
Editor on it. Any knob you can touch, you can automate, from here.</p>

<p id="PRMMNU-2"><b>Type in value...</b> - exact numeric entry, for when a
drag will not land on the number you want. Value controls only; a bare
selector does not offer it.</p>

<p><b>Modulate envelope...</b> - BaySickSolstice controls only, and
only those registered as modulation targets: jumps the BaySickSolstice Mod
editor straight to that control.</p>

<p id="PRMMNU-3"><b>MIDI Learn</b> arms the control - the next thing you
move on your controller binds to it. With no MIDI device plugged in it
reads <code>MIDI Learn (no MIDI input devices)</code> and greys; plug in
and reopen the menu (hot-plug is not watched).</p>

<p><b>MIDI Forget:</b> appears only when the control already
has a mapping, naming the binding it will drop, and
<b>Save MIDI mappings as global default</b>
appears once any mapping exists - your controller layout, kept across
projects.</p>

<p>The menu is offered by every automatable control in the
app. The rare control with deliberately no lane simply does not offer
<code>Automate</code>.</p>
