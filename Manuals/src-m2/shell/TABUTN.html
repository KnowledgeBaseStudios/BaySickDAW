<p>The <code>+</code> slot's menu - where every tab starts. Some entries add
the tab immediately; the ones with a chevron ask one more question
first.</p>

<figure data-views="TABUTN">

<p id="TABUTN-1"><b>BaySickVocal</b> adds a Vox tab - the vocal channel
with its corrector and chain. <span id="TABUTN-2"></span>
<b>BaySickLiveInst</b> adds a live-input instrument tab (greys at the Inst
tab cap).</p>

<p id="TABUTN-3"><b>BaySickGuitars</b> and <span id="TABUTN-4"></span>
<b>BaySickBasses</b> add the sampled guitar and bass.</p>

<p id="TABUTN-5"><b>VSTPlugin</b> lists your added third-party instruments
alphabetically - empty, it reads
<code>None added - see Options &gt; Plugins</code>.</p>

<p id="TABUTN-6"><b>Harmless</b> asks which tab family to put it on
(Layers or Bass); <span id="TABUTN-7"></span><b>BaySickSynth</b> adds
straight to Layers; <span id="TABUTN-8"></span><b>BaySickPlayer</b> asks -
Layers, Bass or Audio Clips; <span id="TABUTN-9"></span>
<b>BaySickBass</b> adds straight to Bass.</p>

<p id="TABUTN-10"><b>BaySickDrums</b> builds a Drums tab around a player
or synth engine, and <span id="TABUTN-11"></span>
<b>BaySickRustyDrums</b> adds the sampled kit - greyed while a Rusty tab
already exists, one kit at a time.</p>
