<p>The Piano Roll's Edit menu.</p>

<figure data-views="PRE">

<p id="PRE-1"><b>Select All</b> (Ctrl+A) and <span id="PRE-2"></span>
<b>Deselect</b> manage the selection.</p>

<p id="PRE-3"><b>Copy</b> (Ctrl+C), <span id="PRE-4"></span><b>Paste</b>
(Ctrl+V), <span id="PRE-5"></span><b>Delete</b> and
<span id="PRE-6"></span><b>Duplicate</b> (Ctrl+B) act on selected notes -
Duplicate places the copy right after the original, the fastest way to
repeat a phrase.</p>
