<p>The Piano Roll's Scale menu - stay in key without knowing the theory.</p>

<figure data-views="PRS">

<p id="PRS-1"><b>Snap to Scale</b> - the tick shows a scale is active.
With it on, drawn and dragged notes land on legal pitches; the wrong notes
simply stop being reachable.</p>

<p id="PRS-2"><b>Root</b> picks the key's home note - <code>C</code>
through <code>B</code> - and <span id="PRS-3"></span><b>Scale</b> picks
the flavor from the list. Root plus scale is the whole definition:
C + Minor means every note you place belongs to C minor.</p>
