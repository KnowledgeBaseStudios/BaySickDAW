<p>The Builder is where patterns become a song. Left side: the browser. Right
side: the grid - time running left to right, one
row per track - where you place blocks. The toolbar between them decides
what your mouse does.</p>

<figure data-cluster="The browser|3,4,5,6">

<p id="BLD-3"><b>The three sources</b> - <code>Patterns</code> /
<code>Files</code> / <code>Auto</code> - decide what the browser lists:
your patterns, your audio files, or automation clips.
<span id="BLD-4"></span><b>+ Add</b> makes a new empty pattern,
<span id="BLD-5"></span><b>Delete</b> removes the selected one (its time
markers go with it), and <span id="BLD-6"></span><b>each row</b> in the
list can be dragged onto the grid to place it as a block.
<b>Sort</b> appears on the Files tab to order
its lists.</p>

<figure data-cluster="The toolbar|7,8,9,10,11,12">

<p id="BLD-7"><b>Snap</b> makes drags and drops land on the grid lines -
on for arranging, off for free placement.
<span id="BLD-8"></span><b>The tool buttons</b> - Draw, Paint, Select,
Delete, Mute, Slice, Zoom, Play, each with its key in parentheses - pick
the mouse's job; one is active at a time.
<span id="BLD-9"></span><b>Stretch</b> is a tool with its own dropdown:
grab a block's edge and its CONTENTS stretch in time, tempo-aware.</p>

<p id="BLD-10"><b>Undo / Redo</b> ride the app-wide history (greyed when
empty at that end), <span id="BLD-11"></span><b>H</b> opens the full
history as a clickable list, and
<span id="BLD-12"></span><b>- / +</b> zoom the timeline.</p>

<figure data-cluster="The ruler|13,14,21,22">

<p id="BLD-13"><b>The breadcrumb</b> (<code>Playlist &gt;
Pattern 1</code>) names what the grid is currently editing, and
<span id="BLD-14"></span><b>the ruler</b> counts the bars.
<span id="BLD-21"></span><b>The ruler's markers</b>: yellow pennants are
your named time markers; blue pills are time-signature changes
(<code>4/4</code> - outlined when a pattern brought it along, solid when
placed by hand); amber pills are tempo changes.
<span id="BLD-22"></span><b>The playhead</b> - the green flag with its
line down the grid - is where playback is.</p>

<figure data-cluster="Tracks|15,16,17,18">

<p id="BLD-15"><b>The track rows</b> - hundreds available, each with
<span id="BLD-16"></span><b>M</b>ute,
<span id="BLD-17"></span><b>S</b>olo, and
<span id="BLD-18"></span><b>a name</b> you can rename (and renaming is
undoable like any edit).</p>

<figure data-cluster="The grid|19,20">

<p id="BLD-19"><b>The grid canvas</b> is the song itself: blocks placed,
stretched, sliced, muted. Any edit - blocks, names, groups - lands on the
undo history as ONE step, however much it touched.
<span id="BLD-20"></span><b>The browser's edge</b> is draggable: resize
the browser, or drag it past its floor and the whole thing folds away -
a chevron marks where to get it back.</p>

<p id="BLD-1">The window's <b>Edit</b> and <span id="BLD-2"></span>
<b>View</b> menus - and the Menu dropdown - each have their own pages.</p>

<p>Every Builder shortcut - the tool keys in parentheses above and the
rest - is listed on the Key Binds window's <code>Builder Page</code> tab,
in the Help menu.</p>
