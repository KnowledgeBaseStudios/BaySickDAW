<p>The transport bar runs the song: play, record, tempo and time, always
visible across the top of the app.</p>

<figure data-cluster="Play, stop, record|1,2,3,4,5">

<p id="TRAN-1"><b>Play</b> (Space), <span id="TRAN-2"></span><b>Pause</b>
(Space again while playing), <span id="TRAN-3"></span><b>Stop</b>
(Shift+Space) - stop also disarms recording and returns to the start.</p>

<p id="TRAN-4"><b>Record.</b> The dot arms recording - press it, then
play, and the take is captured.
<span id="TRAN-5"></span><b>Its chevron</b> - only the thin strip on the
button's right edge - opens the recording menu: whether you are capturing
AUDIO (a microphone or instrument) or MIDI (notes into the Piano Roll),
and the record-quantize. The dot records; the chevron configures.</p>

<figure data-cluster="Tempo|6,7">

<p id="TRAN-6"><b>The BPM field</b> - the amber display - is the song's
tempo in beats per minute. Click it and type. Right-click offers
<code>Automate tempo</code>, for songs whose speed changes as they go.
<span id="TRAN-7"></span><b>TAP</b> sets the tempo from your tapping: tap
the button in time and the field locks onto the rate.</p>

<figure data-cluster="Mode and loop|8,9">

<p id="TRAN-8"><b>PATTERN / SONG</b> is what the play button plays: the
current pattern looping around (where you build parts), or the whole
arrangement from the Builder (where you hear the song). Most writing
happens in pattern mode.
<span id="TRAN-9"></span><b>The loop toggle</b> decides whether the song
repeats at its end or plays through and stops.</p>

<figure data-cluster="Metronome and keyboard|10,11,12">

<p id="TRAN-10"><b>The metronome</b> toggles the click track - the steady
click that marks the beat - and
<span id="TRAN-11"></span><b>its chevron</b> opens the metronome's
settings: the click sound, its volume, and the one-bar count-in before a
recording.</p>

<p id="TRAN-12"><b>The typing-keyboard toggle</b> - the four painted
piano keys (Ctrl+T) - turns your computer keyboard into a playable
instrument aimed at the open piano-roll tab. No MIDI keyboard required to
play notes in.</p>

<figure data-cluster="Swing, pattern, position|13,14,15">

<p id="TRAN-13"><b>The Swing knob</b> pushes every second sixteenth-note
late, across the whole app. Each player has its own Swing Mix knob
deciding how much of this global amount it applies, so drums can swing
hard while a pad stays straight.</p>

<p id="TRAN-14"><b>The pattern dropdown</b> picks which pattern you are
working in, and <span id="TRAN-15"></span><b>the position readout</b> -
amber, <code>0:00.000</code> - shows where playback is in minutes and
seconds.</p>
