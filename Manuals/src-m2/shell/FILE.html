<p>File Settings - what gets written when you record, and when the app
manages CPU for you.</p>

<figure data-views="FILE">

<p id="FILE-1"><b>The take types.</b> Every vocal record stop can write up
to four versions of the take - <code>Dry</code> (untouched),
<code>Dry Cleaned</code> (de-noised), <code>Wet</code> (through the
chain), <code>Wet Cleaned</code>. Tick the ones you want on disk; at least
one always stays checked, and your Builder Grid Default pick is always
written regardless.</p>

<p id="FILE-2"><b>De-noise strength</b> is what "Cleaned" means -
<code>Strong</code> removes more noise, at more risk of affecting the voice.</p>

<p id="FILE-3"><b>Auto-freeze above</b> - the DSP load at which tabs start
freezing themselves (<code>80 %</code> default). When the meter runs hot,
the app renders the heaviest tabs instead of letting audio break
up. <span id="FILE-6"></span><b>Enable Instrument Level Freeze</b> lets
that mechanism work per
instrument.<span id="FILE-4"></span><span id="FILE-5"></span></p>
