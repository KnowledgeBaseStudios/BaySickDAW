<p>The File menu - projects in, projects out.</p>

<figure data-views="FMENU">

<p id="FMENU-1"><b>New Project...</b> (Ctrl+N) starts fresh - behind the
unsaved-changes gate, like every entry that would discard work.
<span id="FMENU-2"></span><b>New from Template</b> starts from a skeleton
instead: your default template, the premade ones, or your own.</p>

<p id="FMENU-3"><b>Open Project...</b> (Ctrl+O) browses for one;
<span id="FMENU-4"></span><b>Quick Open Project...</b> is the fast path;
<span id="FMENU-5"></span><b>Open Recent</b> lists the last ten - missing
ones greyed with <code>(missing)</code> - plus
<code>Clear Recent Projects</code>.</p>

<p id="FMENU-6"><b>Save</b> (Ctrl+S), <span id="FMENU-7"></span><b>Save
As...</b> (Shift+Ctrl+S), and <span id="FMENU-8"></span><b>Save as
Template...</b> - the last one saves the whole project as a reusable
skeleton for New from Template.</p>

<p id="FMENU-9"><b>Restore from Backup...</b> reaches the automatic
backups when something has gone wrong with the project itself.</p>

<p id="FMENU-10"><b>Import Audio...</b> brings an audio file in as a
clip.</p>

<p id="FMENU-11"><b>Export Audio...</b> opens the render dialog, and
<span id="FMENU-12"></span><b>Export Project Bundle...</b> packs the whole
project to travel - each has its own page.</p>
