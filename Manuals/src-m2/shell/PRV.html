<p>The Piano Roll's View menu.</p>

<figure data-views="PRV">

<p id="PRV-1"><b>Zoom In / Out</b> scale time, and
<span id="PRV-3"></span><b>the Vertical pair</b> scale pitch - tall rows
for precise edits, short rows for seeing the whole part.
<span id="PRV-2"></span><span id="PRV-4"></span></p>

<p id="PRV-5"><b>Scroll to Playhead</b> jumps the view to wherever
playback is.</p>

<p id="PRV-6"><b>Ghost Notes</b> - tick when on - draws the OTHER tabs'
notes faintly behind yours, so a bassline can be written against the
chords without leaving the window.</p>

<p id="PRV-7"><b>Velocity Lane</b> shows or hides the controller lane at
the bottom.</p>
