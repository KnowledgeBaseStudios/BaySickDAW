<p>The Export Project Bundle dialog - the whole project packed to travel:
open it on another machine, or archive it knowing every file it needs came
along.</p>

<figure data-views="BUNDLE">

<p id="BUNDLE-1"><b>Bundle as</b> - one <code>.zip</code> for sending, or
a plain folder for archiving.</p>

<p id="BUNDLE-2"><b>Contents</b> is the decision that matters:
<code>Include my samples + outside files</code> makes the bundle
self-contained - it opens on a machine that has none of your libraries.
The narrower choices make smaller bundles that depend on the destination
having the same content installed.</p>

<p id="BUNDLE-3"><b>Export / Cancel</b> run it or close it.
The size estimate shown counts the project
folder itself as well as every referenced file, so it is the real download
size.</p>
