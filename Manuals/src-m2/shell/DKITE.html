<p>The Drum Kit's Edit menu - the same edit set as the Piano Roll's.</p>

<figure data-views="DKITE">

<p id="DKITE-1"><b>Select All</b> (Ctrl+A), <span id="DKITE-2"></span>
<b>Deselect</b>, <span id="DKITE-3"></span><b>Copy</b> (Ctrl+C),
<span id="DKITE-4"></span><b>Paste</b> (Ctrl+V),
<span id="DKITE-5"></span><b>Delete</b> and
<span id="DKITE-6"></span><b>Duplicate</b> (Ctrl+B) - selection and
clipboard over drum hits, exactly as on the roll. Duplicate is the
beat-builder: select a bar of groove, Ctrl+B, and it repeats.</p>
