<p>The Key Binds window - every keyboard shortcut, viewable and reboundable
in one place.</p>

<figure data-views="KEYS">

<p id="KEYS-1"><b>The category tabs</b> - <code>General</code>,
<code>Builder Page</code>, <code>Piano Roll</code>, <code>Drum Kit</code>,
<code>Vocal Editor</code>, <code>Event Editor</code>. A binding lives in
exactly one category and applies where that surface is focused - the same
key can safely mean different things on different pages.</p>

<p id="KEYS-2"><b>Action</b> says what the row does,
<span id="KEYS-3"></span><b>Shortcut</b> shows the current binding in the
app's own wording (<code>spacebar</code>,
<code>ctrl + shift + S</code>...).</p>

<p id="KEYS-4"><b>Set</b> arms a row - the next chord you press becomes
its binding. <span id="KEYS-5"></span><b>Reset</b> returns that one row
to its default.</p>
